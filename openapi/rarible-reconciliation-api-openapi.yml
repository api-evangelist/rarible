openapi: 3.2.0
info:
  title: OpenAPI definition Reconciliation API
  version: v0.1
  description: '# Exciting News


    Hey there, amazing developers!'
servers:
- url: https://{environment}.rarible.org
  description: Production (Mainnet)
  variables:
    environment:
      enum:
      - api
      - testnet-api
      default: api
security:
- ApiKeyAuth: []
tags:
- name: Reconciliation
  x-controller: ReconciliationController
paths:
  /v0.1/reconciliation/items:
    get:
      tags:
      - Reconciliation
      summary: Get IDs of items updated after a specific datetime
      description: Return short view of items updated after a specific datetime.
      operationId: getReconciliationItems
      parameters:
      - name: blockchain
        in: query
        required: true
        allowEmptyValue: true
        description: Blockchain name
        schema:
          $ref: '#/components/schemas/Blockchain'
      - name: updatedAfterInclusive
        in: query
        required: true
        allowEmptyValue: true
        description: Only items with lastUpdatedAt after (inclusive) will be returned
        schema:
          type: string
          format: date-time
      - name: updatedBeforeExclusive
        in: query
        required: true
        allowEmptyValue: true
        description: Only items with lastUpdatedAt before (exclusive) will be returned
        schema:
          type: string
          format: date-time
      - name: continuation
        in: query
        required: false
        description: Paging cursor
        schema:
          type: string
      - name: size
        in: query
        required: false
        description: The maximum number of results to be returned. If not specified, a predefined number is used.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationEntities'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v0.1/reconciliation/collections:
    get:
      tags:
      - Reconciliation
      summary: Get IDs of collections updated after a specific datetime
      description: Return short view of collections updated after a specific datetime.
      operationId: getReconciliationCollections
      parameters:
      - name: blockchain
        in: query
        required: true
        allowEmptyValue: true
        description: Blockchain name
        schema:
          $ref: '#/components/schemas/Blockchain'
      - name: updatedAfterInclusive
        in: query
        required: true
        allowEmptyValue: true
        description: Only items with lastUpdatedAt after (inclusive) will be returned
        schema:
          type: string
          format: date-time
      - name: updatedBeforeExclusive
        in: query
        required: true
        allowEmptyValue: true
        description: Only items with lastUpdatedAt before (exclusive) will be returned
        schema:
          type: string
          format: date-time
      - name: continuation
        in: query
        required: false
        description: Paging cursor
        schema:
          type: string
      - name: size
        in: query
        required: false
        description: The maximum number of results to be returned. If not specified, a predefined number is used.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationEntities'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    Blockchain:
      type: string
      enum:
      - APTOS
      - ETHEREUM
      - POLYGON
      - SOLANA
      - ARBITRUM
      - CHILIZ
      - LIGHTLINK
      - ZKSYNC
      - BASE
      - RARI
      - ZKLINK
      - QUAI
      - ECLIPSE
      - ELECTRONEUM
      - SAAKURU
      - OASIS
      - MATCH
      - MOONBEAM
      - ETHERLINK
      - ZKCANDY
      - BERACHAIN
      - ABSTRACT
      - SHAPE
      - TELOS
      - HEDERAEVM
      - VICTION
      - SETTLUS
      - GOAT
      - HYPEREVM
      - MEGAETH
      - MEGAETHTESTNET
      - MEGAETHTESTNETV2
      - BASECAMP
      - CAMP
      - SOMNIA
      - ARENAZ
      - INJECTIVE
      - INJECTIVETESTNET
      - APECHAIN
      - BLOCKCHAINKEK
      - STELLAR
      - ZILLIQA
      - FRAXTAL
      - XLAYER
      - MONAD
      example: ETHEREUM
    UnionApiErrorServerError:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          enum:
          - UNKNOWN
          default: UNKNOWN
        message:
          type: string
          description: Error message
    ReconciliationEntities:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationEntity'
        continuation:
          type: string
      required:
      - entities
    ReconciliationEntity:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        lastUpdatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          default: false
      required:
      - id
      - version
      - lastUpdatedAt
    UnionApiErrorBadRequest:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - VALIDATION
          default: BAD_REQUEST
        message:
          type: string
          description: Error message
  responses:
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnionApiErrorServerError'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnionApiErrorBadRequest'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      x-default: 11111111-1111-1111-1111-111111111111
